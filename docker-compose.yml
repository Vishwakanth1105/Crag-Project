services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: agentic-graph-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: agentic-graph-rag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: agentic-graph-rag-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag}
      MYSQL_USER: ${MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: agentic-graph-rag-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.5.7
    container_name: agentic-graph-rag-ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  ollama-init:
    image: ollama/ollama:0.5.7
    container_name: agentic-graph-rag-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-gemma2:2b}"]
    restart: "no"

  api:
    build: .
    container_name: agentic-graph-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql+pymysql://rag:rag_password@mysql:3306/rag?charset=utf8mb4}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
    volumes:
      - ./data:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  worker:
    build: .
    container_name: agentic-graph-rag-worker
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql+pymysql://rag:rag_password@mysql:3306/rag?charset=utf8mb4}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
    volumes:
      - ./data:/data
      - hf_cache:/root/.cache/huggingface
    command: ["python", "-m", "src.worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /data/worker.heartbeat -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: agentic-graph-rag-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  mysql_data:
  minio_data:
  ollama_data:
  hf_cache:
