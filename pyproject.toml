[project]
name = "agentic-graph-rag"
version = "0.1.0"
description = "Production-grade agentic CRAG and GraphRAG system using LangGraph, Qdrant, Neo4j, Cohere, and FastAPI."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
